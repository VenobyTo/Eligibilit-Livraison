services:
  # --- Entraînement du modèle ---
  train:
    build: .
    container_name: livraison-train
    volumes:
      - ./artifacts:/app/artifacts
      - ./data/generated:/app/data/generated
      - ./reports:/app/reports
    environment:
      - GIT_PYTHON_REFRESH=quiet
    command: python -m eligibilite_livraison.train

  # --- Orchestrateur MLOps (entraînement planifié / DAG) ---
  orchestrator:
    build: .
    container_name: livraison-orchestrator
    volumes:
      - ./artifacts:/app/artifacts
      - ./data/generated:/app/data/generated
      - ./reports:/app/reports
    environment:
      - GIT_PYTHON_REFRESH=quiet
      - ORCHESTRATOR_INTERVAL_SECONDS=86400
    command: python -m eligibilite_livraison.orchestrator

  # --- API FastAPI de prédiction ---
  api:
    build: .
    container_name: livraison-api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    environment:
      - GIT_PYTHON_REFRESH=quiet
    command: uvicorn eligibilite_livraison.api:app --host 0.0.0.0 --port 8000

  # --- Tests unitaires ---
  test:
    build: .
    container_name: livraison-test
    environment:
      - GIT_PYTHON_REFRESH=quiet
    command: python -m unittest discover -s tests -v
    profiles:
      - test

  # --- Interface MLflow ---
  mlflow:
    build: .
    container_name: livraison-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
    command: >
      mlflow ui
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow.db
    profiles:
      - mlflow
