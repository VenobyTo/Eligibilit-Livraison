name: livraison-express-test

services:
  mongodb-test:
    image: mongo:8
    container_name: livraison-mongo-test
    ports:
      - "${MONGO_TEST_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livraison-app-test
    depends_on:
      mongodb-test:
        condition: service_healthy
    environment:
      - GIT_PYTHON_REFRESH=quiet
      - MONGO_URI=mongodb://mongodb-test:27017
      - MONGO_DB=livraison_express_test
      - PYTHONPATH=/app/src
    command: python -m unittest discover -s tests -v

  train-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livraison-train-test
    depends_on:
      mongodb-test:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    environment:
      - GIT_PYTHON_REFRESH=quiet
      - MONGO_URI=mongodb://mongodb-test:27017
      - MONGO_DB=livraison_express_test
      - PYTHONPATH=/app/src
    command: python -m eligibilite_livraison.train
    profiles:
      - train
