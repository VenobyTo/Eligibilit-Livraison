name: CI/CD - Tests & Publication Docker (GHCR)

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # JOB 1 : Tests unitaires, intégration MongoDB & validation du pipeline ML
  # ============================================================================
  test:
    name: Tests Unitaires & Intégration MongoDB
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installation des dépendances et du package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Exécution de la suite de tests (Unitaires, API, Repository, Orchestrateur)
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: livraison_express_ci
          GIT_PYTHON_REFRESH: quiet
        run: |
          python -m unittest discover -s tests -v

  # ============================================================================
  # JOB 2 : Construction & Publication de l'image Docker optimisée sur GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: Normalisation du nom de l'image en minuscules
        run: |
          echo "IMAGE_LC=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentification sur GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées et tags OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LC }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construction et publication de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
